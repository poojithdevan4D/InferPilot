study:
  id: inferpilot-fp8-preemption-heldout-v1
  status: preregister_before_execution
  research_question: >-
    Does baseline recomputation pressure predict a material fp8-KV improvement
    in SLO-constrained serving capacity, and does fp8 reduce that pressure?
  primary_outcome: max_offered_qps_meeting_all_slos

hypotheses:
  positive_regime:
    baseline_kv_usage_threshold: 0.95
    minimum_fraction_window_above_threshold: 0.25
    recompute_burden_min: 0.10
    predicted_geometric_mean_capacity_ratio_min: 1.25
    required_cluster_bootstrap_ci95_lower_bound: 1.10
  negative_regime:
    recompute_burden_max: 0.01
    equivalence_margin_capacity_ratio: [0.90, 1.10]
    test: paired_TOST_on_log_ratio
    alpha: 0.05
  dose_response:
    metric: spearman_rho_baseline_recompute_burden_vs_log_capacity_ratio
    predicted_minimum: 0.60
    required_cluster_bootstrap_ci95_lower_bound: 0.0
  mechanism:
    predicted_median_recompute_burden_reduction_min: 0.50
  prediction:
    material_gain_threshold: 0.15
    fixed_classifier_threshold_recompute_burden: 0.10
    validation: leave_one_model_family_out
    required_balanced_accuracy: 0.80

core_matrix:
  models:
    - id: Qwen/Qwen2.5-3B-Instruct
      gpu: A10G
      family: qwen2
    - id: mistralai/Mistral-7B-Instruct-v0.3
      gpu: A10G
      family: mistral
    - id: Qwen/Qwen2.5-14B-Instruct
      gpu: A100-40GB
      family: qwen2
  workloads:
    - id: long_prefill
      input_tokens_distribution: lognormal_centered_8192
      output_tokens_distribution: lognormal_centered_256
      slo:
        ttft_p95_ms_max: 10000
        itl_p95_ms_max: 80
        success_rate_min: 0.99
    - id: decode_heavy
      input_tokens_distribution: lognormal_centered_512
      output_tokens_distribution: lognormal_centered_1024
      slo:
        ttft_p95_ms_max: 1000
        itl_p95_ms_max: 60
        success_rate_min: 0.99
  load_multipliers_of_blinded_bf16_pilot_capacity: [0.60, 0.85, 1.05, 1.30]
  arms:
    - kv_cache_dtype: auto
    - kv_cache_dtype: fp8
  repetitions_per_arm: 3
  paired_arrival_and_prompt_seed_within_block: true
  randomized_arm_order: true
  fresh_server_per_arm: true
  minimum_steady_measurement_seconds: 90
  maximum_steady_measurement_seconds: 180
  minimum_terminal_requests: 100

transportability_subset:
  cells: 8
  engines:
    - sglang_pinned_release
    - previous_supported_vllm_minor
  model: Qwen/Qwen2.5-3B-Instruct
  workloads: [long_prefill, decode_heavy]
  load_multipliers: [0.85, 1.05]

required_metrics:
  request:
    - scheduled_arrival
    - actual_arrival
    - queue_entry
    - first_scheduled
    - first_token
    - terminal_time_and_state
    - requested_and_actual_token_counts
    - ttft_itl_e2e
  scheduler:
    - waiting_and_running_requests
    - scheduled_prefill_decode_and_recompute_tokens
    - preempted_computed_tokens_total
    - recomputed_token_executions_total
    - useful_prompt_and_output_tokens
    - preemption_mode_reason_and_events
    - kv_occupancy_and_block_events
    - prefix_hits
    - effective_batch_sizes
  system:
    - gpu_sm_activity
    - gpu_memory_bandwidth
    - gpu_power_and_memory
    - cpu_utilization
    - dispatch_drift

analysis:
  capacity_estimator: monotone_isotonic_slo_attainment
  proven_pass_rule: one_sided_95pct_bounds_pass_every_slo
  capacity_interval: [highest_proven_pass_rate, lowest_proven_fail_rate]
  primary_ci: paired_cluster_bootstrap_by_model_workload_cell
  secondary_model: >-
    log(capacity_ratio) ~ log(1 + recompute_burden) + engine + workload +
    (1 | model_family)
  exploratory_multiple_testing: Holm
  publish_all_cells_and_exclusions: true

counterexamples:
  - recompute_burden_ge_0.10_and_gain_lt_0.10
  - recompute_burden_le_0.01_and_gain_gt_0.15
  - fp8_worsens_capacity_or_any_slo
  - capacity_improves_without_recompute_reduction
  - quality_failure
  - engine_version_sign_reversal

decision:
  promote_validated_heuristic_if:
    - positive_regime_hypothesis_passes
    - negative_regime_equivalence_passes
    - predictive_balanced_accuracy_passes
    - no_unresolved_severe_counterexample
    - quality_passes_for_supported_envelope
  retire_or_refute_if_any:
    - positive_regime_ci_lower_bound_le_1.0
    - predictive_balanced_accuracy_lt_0.65
    - frequent_sign_reversals
    - supported_envelope_quality_is_impractical

budget:
  currency: USD
  target_max: 35
  hard_stop: 45
  absolute_user_limit: 50
  drop_first_if_over_budget: transportability_subset
  never_drop_for_budget:
    - repetitions
    - core_heldout_cells
    - publication_of_failed_runs
