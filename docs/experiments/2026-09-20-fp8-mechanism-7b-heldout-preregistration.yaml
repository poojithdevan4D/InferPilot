study:
  id: inferpilot-fp8-mechanism-7b-heldout-v1
  status: preregistered_before_heldout_measurement
  purpose: >-
    Test whether exact baseline recomputation distinguishes a material fp8-KV throughput benefit
    from a negligible benefit on a non-trivial 7B model. This is a focused held-out mechanism test,
    not the older multi-model capacity campaign.
  development_sources:
    - 2026-09-18-demo-3b-kv-fp8-win.md
    - 2026-09-20-fp8-instrumentation-pilot-v2-results.md
  heldout_outcomes_inspected_at_freeze: false

scope:
  model: Qwen/Qwen2.5-7B-Instruct
  model_revision: a09a35458c702b33eeacc393d103063234e8bc28
  gpu: A10G
  engine: vllm
  engine_version: 0.29.0
  container_image: ghcr.io/poojithdevan4d/vllm-inferpilot
  container_image_digest: sha256:725769f8279dd5d50fc366fb9183a687e19ea1669ad4cdb2fa3904c29a3d35c1
  sampler_backend: pytorch
  arms:
    - id: bf16_kv
      kv_cache_dtype: auto
    - id: fp8_kv
      kv_cache_dtype: fp8
  only_varied_engine_field_within_pair: kv_cache_dtype
  fixed_engine_fields:
    dtype: bfloat16
    max_num_seqs: 128
    max_num_batched_tokens: 2048
    gpu_memory_utilization: 0.90
    generation_config: vllm
    enable_prefix_caching: false
    enable_chunked_prefill: true
    async_scheduling: false
    speculative_decoding: disabled_no_speculative_model_or_flags
    enable_logging_iteration_details: true

workloads:
  - id: long_context_positive
    max_model_len: 5120
    prompt_tokens: 4096
    output_tokens: 512
    request_rate_qps: 4.0
    prediction: baseline_preempts_and_recomputes_fp8_materially_improves
  - id: short_context_negative
    max_model_len: 1024
    prompt_tokens: 512
    output_tokens: 128
    request_rate_qps: 4.0
    prediction: baseline_recomputation_near_zero_fp8_gain_negligible
  common:
    arrival_pattern: poisson-v1
    num_requests: 100
    warmup_requests: 4
    temperature: 0.0
    ignore_eos: true
    request_timeout_s: 1200
    fixed_lengths_not_production_trace: true

blocks:
  - block: 1
    prompt_seed: 9401
    arrival_seed: 141
  - block: 2
    prompt_seed: 9402
    arrival_seed: 142
  - block: 3
    prompt_seed: 9403
    arrival_seed: 143

execution:
  fresh_server_per_cell: true
  total_cells: 12
  exact_order:
    - [1, long_context_positive, bf16_kv]
    - [1, short_context_negative, fp8_kv]
    - [1, long_context_positive, fp8_kv]
    - [1, short_context_negative, bf16_kv]
    - [2, short_context_negative, bf16_kv]
    - [2, long_context_positive, fp8_kv]
    - [2, short_context_negative, fp8_kv]
    - [2, long_context_positive, bf16_kv]
    - [3, long_context_positive, bf16_kv]
    - [3, short_context_negative, fp8_kv]
    - [3, long_context_positive, fp8_kv]
    - [3, short_context_negative, bf16_kv]
  rationale: >-
    Workloads were selected from legacy development evidence. Seeds are new. Arm/workload order is
    fixed and counterbalanced before held-out execution; partial outcomes cannot change it.

acceptance:
  result_status: COMPLETED
  successful_requests: 100
  failed_requests: 0
  effective_config_verified: true
  warmups_successful: 4
  load_evidence_required: true
  coverage_complete: true
  steady_state: true
  minimum_arrivals: 100
  minimum_window_seconds: 30
  dispatch_drift_p95_ms_max: 10
  metrics_capability_ready: true
  mechanism_evidence_coverage_complete: true
  lifecycle_pre_teardown_errors: 0
  telemetry_complete: true
  preserve_every_attempt: true

hypotheses:
  positive_regime_required:
    - every_bf16_long_cell_load_state_overloaded
    - every_bf16_long_cell_preemptions_positive
    - every_bf16_long_cell_recompute_burden_ge_0.01
  positive_effect_required:
    - geometric_mean_long_throughput_ratio_fp8_over_bf16_ge_1.20
    - every_long_throughput_ratio_ge_1.10
    - median_long_recompute_burden_reduction_ge_0.50
    - no_long_success_or_registered_latency_regression_gt_10pct
  negative_regime_required:
    - every_bf16_short_cell_recompute_burden_le_0.01
    - every_bf16_short_cell_preemptions_zero
  negative_effect_required:
    - geometric_mean_short_throughput_ratio_within_0.90_to_1.10
    - every_short_throughput_ratio_within_0.85_to_1.15
    - no_short_success_or_registered_latency_regression_gt_10pct
  separation_required:
    - minimum_long_baseline_recompute_burden_gt_maximum_short_baseline_recompute_burden
    - minimum_long_throughput_ratio_gt_maximum_short_throughput_ratio
  interpretation: >-
    SUPPORTS_MECHANISM_WITHIN_ENVELOPE requires every registered condition. NOT_TARGET_REGIME means
    the frozen workloads failed to create the predicted pressure contrast. INCONCLUSIVE means the
    target contrast existed but some effect threshold failed. A result is never promoted to
    cross-model causality or deployment advice.

retry_and_stop:
  retry_once_only_for:
    - sole_dispatch_drift_exceeded
    - provider_launch_failure_before_measurement
  no_seed_substitution: true
  any_other_rejection_stops_before_outcome_comparison: true
  preserve_failed_attempts: true

budget:
  currency: USD
  prior_counted_inferpilot_spend_usd: 0.8084
  expected_incremental_usd: 3
  target_total_usd: 6
  hard_stop_total_usd: 12
  absolute_user_limit_usd: 30
  worst_case_next_cell_allowance_usd: 2
  enforcement: >-
    Before each cell, stop if accrued estimated InferPilot spend plus $2 could exceed $12. Existing
    unrelated user training jobs are outside this study and are never modified by this runner.

excluded_claims:
  - cross_model_or_cross_engine_generality
  - causal_identification_beyond_the_controlled_pair
  - maximum_slo_constrained_capacity
  - variable_length_or_production_traffic_behavior
  - quality_safety_or_losslessness
  - deployment_readiness
