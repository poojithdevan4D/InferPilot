name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          version: "0.11.21"
          enable-cache: true
      - name: Install locked development environment
        run: uv sync --extra dev --locked
      - name: Run contract and integration tests
        run: uv run --extra dev pytest -q
      - name: Build package
        run: uv build
      - name: Run advertised GPU-free demos
        run: |
          uv run python scripts/aligned_load_demo.py
          uv run python scripts/fp8_law_demo.py
          uv run python scripts/cost_rescue_demo.py
