[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "inferpilot"
version = "0.1.0"
description = "The vLLM doctor — diagnose your inference server and know if a config change (like fp8 KV cache) will actually help."
readme = "README.md"
requires-python = ">=3.10,<3.15"
license = { text = "MIT" }
authors = [{ name = "poojithdevan4D" }]
keywords = [
    "vllm", "llm", "llm-inference", "inference", "kv-cache", "fp8",
    "mlops", "llmops", "gpu", "benchmarking", "serving", "prometheus",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: System :: Monitoring",
    "Typing :: Typed",
]
dependencies = [
    "pydantic>=2.6,<3",
    "httpx>=0.27,<1",
]

[project.urls]
Homepage = "https://github.com/poojithdevan4D/InferPilot"
Repository = "https://github.com/poojithdevan4D/InferPilot"
Issues = "https://github.com/poojithdevan4D/InferPilot/issues"

[project.scripts]
inferpilot = "inferpilot.cli:main"

# The serving engine is intentionally NOT a project dependency: it is launched as
# a subprocess and must be installed in a dedicated Python 3.12 environment.
# Pinned exactly to vllm==0.29.0 (see README and inferpilot.runner.defaults).

[project.optional-dependencies]
dev = [
    "pytest>=8",
]

[tool.hatch.build.targets.wheel]
packages = ["src/inferpilot"]

[tool.hatch.build.targets.sdist]
include = ["src/inferpilot", "README.md", "LICENSE", "pyproject.toml"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
