[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "inferpilot"
version = "0.1.0"
description = "Autonomous LLM inference-optimization system — Milestone 1 data contracts."
readme = "README.md"
requires-python = ">=3.10,<3.15"
license = { text = "MIT" }
dependencies = [
    "pydantic>=2.6,<3",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
]

[tool.hatch.build.targets.wheel]
packages = ["src/inferpilot"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
